name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Run unit tests
        run: |
          go test -v -cover ./...

      - name: Build GMT binary
        run: |
          go build -v -o gmt ./cmd/gmt

      - name: Verify CLI binary execution
        run: |
          ./gmt help
